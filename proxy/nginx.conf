events {}
http {
  upstream game_api { server backend:3001; server backend2:3001; }
  server {
    listen 80;
    client_max_body_size 12m;
    location /api/auth/ { proxy_pass http://auth-service:3002; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
    location /identity/ { proxy_pass http://keycloak:8080; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
    location /api/ { proxy_pass http://game_api; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-Proto $scheme; }
    location /health { proxy_pass http://game_api; }
    location / { proxy_pass http://frontend:80; proxy_set_header Host $host; }
  }
}
